name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "24"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install root and package dependencies
        run: |
          npm ci
          npm run ci:install

  ci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify workflow contains required gates
        run: |
          npm ci
          npm run security:ci:test

  database-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Postgres persistence standard
        run: |
          npm ci
          npm run database:check

  auth-sdk-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify vendored coreAuth copies match packages/auth-sdk
        run: |
          npm ci
          npm run check:auth-sdk

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Typecheck all packages
        run: |
          npm ci
          npm run ci:install
          npm run typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test all packages
        run: |
          npm ci
          npm run ci:install
          npm test

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Repository lint
        run: |
          npm ci
          npm run lint
          npm run prettier

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build all packages
        run: |
          npm ci
          npm run ci:install
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan for committed secrets
        run: |
          npm ci
          npm run security:secrets
      - name: Prove secret scanner fails on synthetic secret
        run: npm run security:secrets:test

  dependency-scan:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit npm dependencies
        run: |
          npm ci
          npm run ci:install
          npm run security:audit

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify static analysis gate
        run: |
          npm ci
          npm run security:static
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  docker-build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable Docker images
        run: |
          docker build -t florence/core-api:ci apps/core-api
          docker build -t florence/academy-api:ci apps/academy-web/api
          docker build -f apps/academy-web/Dockerfile.live -t florence/academy-live:ci apps/academy-web
          docker build \
            --build-arg VITE_CORE_URL=https://staging-api.florenceedu.com \
            --build-arg VITE_APPLY_URL=https://www.florenceedu.com/apply \
            --build-arg VITE_ACADEMY_API_URL=https://staging-academy-api.florenceedu.com \
            --build-arg VITE_PATHWAY_API_URL=https://staging-pathway-api.florenceedu.com/api \
            --build-arg VITE_EMPLOYER_CONNECT_API_URL=https://staging-partners.florenceedu.com/api \
            --build-arg VITE_LIVE_URL=https://staging-live.florenceedu.com \
            -f apps/app-web/Dockerfile -t florence/app-web:ci .
          docker build --build-arg VITE_CORE_URL=https://staging-api.florenceedu.com -f apps/pathway-api/Dockerfile -t florence/pathway-api:ci .
          docker build --build-arg VITE_CORE_URL=https://staging-api.florenceedu.com -f apps/employer-connect-api/Dockerfile -t florence/employer-connect-api:ci .
          docker build -f apps/economist-app/Dockerfile -t florence/economist-api:ci .

  migration-dry-run:
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: florence_dry_run
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d florence_dry_run"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dry-run service migrations against disposable Postgres
        run: |
          npm ci
          npm run ci:install
          DATABASE_URL="$(printf '%s' 'postgres://postgres:postgres@localhost:5432/florence_dry_run')"
          export DATABASE_URL
          npm run migration:dry-run

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
