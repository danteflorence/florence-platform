name: deploy-readiness

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to prepare"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - sandbox

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

jobs:
  build-push-and-plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Resolve environment URLs
        run: |
          if [ "$TARGET_ENV" = "sandbox" ]; then
            {
              echo "CORE_URL=https://sandbox-api.florenceedu.com"
              echo "APP_URL=https://sandbox.app.florenceedu.com"
              echo "ACADEMY_API_URL=https://sandbox-academy-api.florenceedu.com"
              echo "PATHWAY_API_URL=https://sandbox-pathway-api.florenceedu.com/api"
              echo "EMPLOYER_API_URL=https://sandbox-partners.florenceedu.com/api"
              echo "LIVE_URL=https://sandbox-live.florenceedu.com"
            } >> "$GITHUB_ENV"
          else
            {
              echo "CORE_URL=https://staging-api.florenceedu.com"
              echo "APP_URL=https://staging.app.florenceedu.com"
              echo "ACADEMY_API_URL=https://staging-academy-api.florenceedu.com"
              echo "PATHWAY_API_URL=https://staging-pathway-api.florenceedu.com/api"
              echo "EMPLOYER_API_URL=https://staging-partners.florenceedu.com/api"
              echo "LIVE_URL=https://staging-live.florenceedu.com"
            } >> "$GITHUB_ENV"
          fi

      - name: Build and push images
        env:
          REGISTRY: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/florenceedu
          SHA: ${{ github.sha }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$REGISTRY/core-api:$SHA" apps/core-api
          docker push "$REGISTRY/core-api:$SHA"
          docker build -t "$REGISTRY/academy-api:$SHA" apps/academy-web/api
          docker push "$REGISTRY/academy-api:$SHA"
          docker build -f apps/academy-web/Dockerfile.live -t "$REGISTRY/academy-live:$SHA" apps/academy-web
          docker push "$REGISTRY/academy-live:$SHA"
          docker build \
            --build-arg VITE_CORE_URL="$CORE_URL" \
            --build-arg VITE_APPLY_URL=https://www.florenceedu.com/apply \
            --build-arg VITE_ACADEMY_API_URL="$ACADEMY_API_URL" \
            --build-arg VITE_PATHWAY_API_URL="$PATHWAY_API_URL" \
            --build-arg VITE_EMPLOYER_CONNECT_API_URL="$EMPLOYER_API_URL" \
            --build-arg VITE_LIVE_URL="$LIVE_URL" \
            -f apps/app-web/Dockerfile -t "$REGISTRY/app-web:$SHA" .
          docker push "$REGISTRY/app-web:$SHA"
          docker build --build-arg VITE_CORE_URL="$CORE_URL" -f apps/pathway-api/Dockerfile -t "$REGISTRY/pathway-api:$SHA" .
          docker push "$REGISTRY/pathway-api:$SHA"
          docker build --build-arg VITE_CORE_URL="$CORE_URL" -f apps/employer-connect-api/Dockerfile -t "$REGISTRY/employer-connect-api:$SHA" .
          docker push "$REGISTRY/employer-connect-api:$SHA"
          docker build -f apps/economist-app/Dockerfile -t "$REGISTRY/economist-api:$SHA" .
          docker push "$REGISTRY/economist-api:$SHA"

      - name: Terraform plan
        working-directory: infra
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          terraform init
          terraform fmt -check -recursive
          terraform validate
          terraform plan \
            -out="$TARGET_ENV.tfplan" \
            -var-file="envs/$TARGET_ENV.tfvars" \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ env.TARGET_ENV }}-plan
          path: infra/${{ env.TARGET_ENV }}.tfplan
