name: florence-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-florence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: florence_core
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d florence_core"]
      interval: 5s
      timeout: 3s
      retries: 30

  core-api:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "node db/migrate.mjs && node scripts/seed-admin.ts && node src/index.ts"
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PUBLIC_CORE_URL: ${PUBLIC_CORE_URL:-http://localhost:8080}
      TOKEN_ISS: ${TOKEN_ISS:-florence-auth}
      TOKEN_AUD: ${TOKEN_AUD:-florence}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      FLORENCE_ALLOWED_DOMAIN: ${FLORENCE_ALLOWED_DOMAIN:-florenceedu.com,example.invalid}
      FLORENCE_REDIRECT_HOSTS: ${FLORENCE_REDIRECT_HOSTS:-localhost,127.0.0.1,.lvh.me,.florenceedu.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-florence}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/florence_core
      FIELD_ENC_PASSPHRASE: ${FIELD_ENC_PASSPHRASE:-changeme}
      DEMO_CLIENT_ID: ${DEMO_CLIENT_ID:-florence-core-demo}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:-changeme}
      CORE_BOOTSTRAP_ADMIN_EMAIL: ${CORE_BOOTSTRAP_ADMIN_EMAIL:-local-admin@example.invalid}
      CORE_BOOTSTRAP_ADMIN_PASSWORD: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:-changeme}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  academy-api:
    build:
      context: ./apps/academy-web/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "node db/migrate.mjs && node src/index.ts"
    ports:
      - "${ACADEMY_API_PORT:-8088}:8088"
    environment:
      PORT: "8088"
      CORE_ISSUER_URL: ${CORE_ISSUER_URL:-http://core-api:8080}
      TOKEN_ISS: ${TOKEN_ISS:-florence-auth}
      TOKEN_AUD: ${TOKEN_AUD:-florence}
      API_JWT_ISSUER: ${TOKEN_ISS:-florence-auth}
      API_JWT_AUDIENCE: ${TOKEN_AUD:-florence}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5174}
      DATABASE_URL: postgres://${POSTGRES_USER:-florence}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/florence_academy
      FIELD_ENC_PASSPHRASE: ${FIELD_ENC_PASSPHRASE:-changeme}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-changeme}
      API_JWT_SECRET: ${API_JWT_SECRET:-changeme}
      DEMO_CLIENT_ID: ${ACADEMY_DEMO_CLIENT_ID:-demo-crm}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET:-changeme}
      REQUIRE_EMAIL_VERIFICATION: "0"
      CORE_EVENTS_URL: ${CORE_EVENTS_URL:-}
      CORE_EVENTS_TOKEN: ${CORE_EVENTS_TOKEN:-}
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  academy-live:
    build:
      context: ./apps/academy-web
      dockerfile: Dockerfile.live
    restart: unless-stopped
    ports:
      - "${ACADEMY_LIVE_PORT:-5179}:5179"
    environment:
      PORT: "5179"
      LIVE_PORT: "5179"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5179/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  app-web:
    build:
      context: .
      dockerfile: apps/app-web/Dockerfile
      args:
        VITE_CORE_URL: ${APP_CORE_URL:-http://localhost:8080}
        VITE_APPLY_URL: ${APP_APPLY_URL:-https://www.florenceedu.com/apply}
        VITE_ACADEMY_API_URL: ${APP_ACADEMY_API_URL:-http://localhost:8088}
        VITE_PATHWAY_API_URL: ${APP_PATHWAY_API_URL:-http://localhost:8787/api}
        VITE_EMPLOYER_CONNECT_API_URL: ${APP_EMPLOYER_CONNECT_API_URL:-http://localhost:8788/api}
        VITE_LIVE_URL: ${APP_LIVE_URL:-http://localhost:5179}
        VITE_DEMO_NURSE_ID: ${VITE_DEMO_NURSE_ID:-local-demo-nurse}
    restart: unless-stopped
    ports:
      - "${APP_WEB_PORT:-5174}:80"
    depends_on:
      core-api:
        condition: service_healthy
      academy-api:
        condition: service_healthy
      academy-live:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  pathway-api:
    build:
      context: .
      dockerfile: apps/pathway-api/Dockerfile
      args:
        VITE_CORE_URL: ${APP_CORE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${PATHWAY_API_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      PATHWAY_DB: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-florence}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/florence_pathway
      CORE_ISSUER_URL: ${CORE_ISSUER_URL:-http://core-api:8080}
      TOKEN_ISS: ${TOKEN_ISS:-florence-auth}
      TOKEN_AUD: ${TOKEN_AUD:-florence}
      ALLOW_SYNTHETIC_SEED: ${ALLOW_SYNTHETIC_SEED:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLORENCE_CORE_CLIENT_ID: ${FLORENCE_PATHWAY_CLIENT_ID:-}
      FLORENCE_CORE_CLIENT_SECRET: ${FLORENCE_PATHWAY_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  employer-connect-api:
    build:
      context: .
      dockerfile: apps/employer-connect-api/Dockerfile
      args:
        VITE_CORE_URL: ${APP_CORE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${EMPLOYER_CONNECT_API_PORT:-8788}:8788"
    environment:
      PORT: "8788"
      ATS_DB: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-florence}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/florence_employer
      CORE_ISSUER_URL: ${CORE_ISSUER_URL:-http://core-api:8080}
      TOKEN_ISS: ${TOKEN_ISS:-florence-auth}
      TOKEN_AUD: ${TOKEN_AUD:-florence}
      ALLOW_SYNTHETIC_SEED: ${ALLOW_SYNTHETIC_SEED:-0}
      ATS_CONNECT_BASE_URL: ${ATS_CONNECT_BASE_URL:-http://localhost:8788}
      ATS_CONNECT_VAULT_KEY: ${ATS_CONNECT_VAULT_KEY:-changeme}
      ATS_WEBHOOK_SECRET: ${ATS_WEBHOOK_SECRET:-changeme}
      STATUS_SYNC_INTERVAL_MS: ${STATUS_SYNC_INTERVAL_MS:-0}
      PRICING_API_URL: ${PRICING_API_URL:-http://economist-api:8094}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLORENCE_CORE_CLIENT_ID: ${FLORENCE_ATS_CLIENT_ID:-}
      FLORENCE_CORE_CLIENT_SECRET: ${FLORENCE_ATS_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
      economist-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  economist-api:
    build:
      context: .
      dockerfile: apps/economist-app/Dockerfile
    restart: unless-stopped
    ports:
      - "${ECONOMIST_API_PORT:-8094}:8094"
    environment:
      PORT: "8094"
      HOST: 0.0.0.0
      NODE_ENV: development
      FLORENCE_CORE_URL: ${FLORENCE_CORE_URL:-}
      FLORENCE_CORE_CLIENT_ID: ${FLORENCE_ECONOMIST_CLIENT_ID:-}
      FLORENCE_CORE_CLIENT_SECRET: ${FLORENCE_ECONOMIST_CLIENT_SECRET:-}
      ECONOMIST_CORE_EVENTS_REQUIRED: "0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8094/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
